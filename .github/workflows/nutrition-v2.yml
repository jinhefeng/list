name: Nutrition V2 iOS validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nutrition-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-and-ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Swift core tests
        run: cd ios && swift test --parallel
      - name: iOS simulator build
        run: |
          xcodebuild -project ios/GanfanHandbook.xcodeproj \
            -scheme GanfanHandbook -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
